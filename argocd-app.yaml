apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-vote
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ElMehdi-elazzouzi/azure-voting-app-redis.git
    targetRevision: master
    path: azure-vote-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true